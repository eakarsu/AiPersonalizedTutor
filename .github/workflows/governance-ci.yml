name: Governed workflow checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test backend/governance/*.test.cjs
      - run: find backend/governance -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - run: node --check backend/src/index.js && node --check backend/src/middleware/auth.js
      - run: bash -n start.sh
      - run: '! grep -E "kill[[:space:]]+-9|pkill|dropdb|createdb|npm[[:space:]]+install|seed\.js|psql.*-f" start.sh'
      - run: grep -q governed_outbox backend/migrations/001_governed_learning_intervention.sql && ! grep -E 'DROP TABLE|TRUNCATE' backend/migrations/001_governed_learning_intervention.sql
